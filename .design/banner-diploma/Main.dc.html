<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@300..700&family=Radio+Canada+Big:wght@400..700&display=swap">
  <style>
    body { margin: 0; font-family: 'Radio Canada', system-ui, sans-serif; }
    a { color: #14722A; } a:hover { color: #12211A; }

    /* ================= EL CARRIL =================
       8px en vez de 4: el doble de grueso, que era lo que le faltaba
       para verse, y aun así la mitad que la barra del banner viejo. */
    .dip-pista {
      position: relative;
      height: 8px;
      border-radius: 4px;
      background: #E8EEE9;
      overflow: hidden;
    }

    /* ================= LA CARGA =================
       Se llena UNA VEZ al entrar, de cero a su sitio. No parpadea en
       bucle: un elemento que late para siempre en una pantalla que se
       lee entera es exactamente lo invasivo que se venía a evitar.
       Carga, llega y se queda. */
    .dip-relleno {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #1E9E3A 0%, #37C25A 100%);
      transform-origin: left center;
      animation: dip-cargar 1150ms cubic-bezier(0.22, 0.61, 0.36, 1) 180ms backwards;
    }
    @keyframes dip-cargar {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* El brillo que recorre lo ya hecho. Tres pasadas y para: es lo que
       hace que se lea «cargando» sin quedarse encendido. */
    .dip-brillo {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      overflow: hidden;
      pointer-events: none;
    }
    .dip-brillo::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 46%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
      animation: dip-barrer 1500ms ease-in-out 900ms 3 backwards;
    }
    @keyframes dip-barrer {
      from { transform: translateX(-120%); }
      to   { transform: translateX(320%); }
    }

    /* La cabeza de la barra: un punto claro justo donde llega, con un
       halo que se apaga al terminar de cargar. Es el único adorno, y
       está donde el ojo ya mira. */
    .dip-cabeza {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6FD98A;
      transform: translate(-50%, -50%);
      animation: dip-asomar 700ms ease-out 1180ms backwards;
    }
    @keyframes dip-asomar {
      from { opacity: 0; box-shadow: 0 0 0 0 rgba(55, 194, 90, 0.55); }
      40%  { opacity: 1; box-shadow: 0 0 0 7px rgba(55, 194, 90, 0.28); }
      to   { opacity: 1; box-shadow: 0 0 0 0 rgba(55, 194, 90, 0); }
    }

    /* Con movimiento reducido, todo llega puesto y nada se mueve. */
    @media (prefers-reduced-motion: reduce) {
      .dip-relleno, .dip-cabeza { animation: none; }
      .dip-brillo::after { display: none; }
    }
  </style>
</helmet>

<div style="background: #F4F7F4; padding: 40px 36px; min-height: 380px; box-sizing: border-box">

  <!-- El saludo de encima, en fantasma, para juzgar si se mete en medio. -->
  <div style="max-width: 1368px; margin: 0 auto 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="width: 168px; height: 11px; border-radius: 6px; background: #E2E8E4"></div>
    <div style="width: 330px; height: 26px; border-radius: 7px; background: #DCE4DE"></div>
  </div>

  <!-- ================= EL BANNER =================
       Sin caja, sin borde, sin superficie: lo que se eligió de la
       dirección A. Lo único que cambia es que ahora se ve. -->
  <section style="max-width: 1368px; margin: 30px auto 0; box-sizing: border-box">

    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 11px">
      <p style="display: flex; align-items: center; gap: 9px; margin: 0">
        <svg viewBox="0 0 20 20" style="width: 16px; height: 16px; flex-shrink: 0; display: block" fill="none" stroke="#14722A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.6 4.2h8.6a1.9 1.9 0 0 1 1.9 1.9v7.8a1.9 1.9 0 0 1-1.9 1.9H5.6"></path>
          <ellipse cx="5.6" cy="10" rx="1.8" ry="5.8"></ellipse>
          <path d="M8.9 8.2h4.6M8.9 11.4h3"></path>
        </svg>
        <span style="font-size: 14.5px; line-height: 1.25; color: #4C5C53">
          <span style="font-family: 'Radio Canada Big', 'Radio Canada', system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; color: #12211A">{{restantes}}</span>
          lecciones para tu diploma
        </span>
      </p>
      <span style="font-size: 12.5px; line-height: 1; color: #8A9891; white-space: nowrap; font-variant-numeric: tabular-nums">{{hechas}} de {{total}}</span>
    </div>

    <div class="dip-pista">
      <div class="dip-relleno" style="width: {{pct}}%">
        <span class="dip-brillo"></span>
      </div>
      <span class="dip-cabeza" style="left: {{pct}}%"></span>
    </div>
  </section>

  <!-- La rejilla de debajo, fantasma. -->
  <div style="max-width: 1368px; margin: 30px auto 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
    <div style="height: 96px; border-radius: 16px; background: #FBFCFB; border: 1px solid #E2E8E4"></div>
    <div style="height: 96px; border-radius: 16px; background: #FBFCFB; border: 1px solid #E2E8E4"></div>
    <div style="height: 96px; border-radius: 16px; background: #FBFCFB; border: 1px solid #E2E8E4"></div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"restantes":{"editor":"int","default":12,"min":0,"max":120,"section":"Diploma"},"total":{"editor":"int","default":72,"min":1,"max":200,"section":"Diploma"},"$preview":{"width":1440,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const total = Math.max(1, this.props.total ?? 72);
    const restantes = Math.min(total, Math.max(0, this.props.restantes ?? 12));
    const hechas = total - restantes;
    // Suelo del 3%: con una sola lección hecha la barra tiene que
    // verse empezada, no vacía.
    const pct = Math.max(3, Math.round((hechas / total) * 100));
    return { restantes, total, hechas, pct };
  }
}
</script>
</body>
</html>
